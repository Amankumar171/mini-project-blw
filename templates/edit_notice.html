<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/style.css">
<title>Edit Notice</title>
</head>
<body>
<h1>Edit Notice</h1>
<form method="post">
Title:
<input type="text" name="title" value="{{ notice.title }}">
<br><br>
Description:
<br>
<textarea name="description" rows="5" cols="40">{{ notice.description }}</textarea>
<br><br>
<button type="submit" name="update">Update Notice</button>
</form>
</body>
</html>
